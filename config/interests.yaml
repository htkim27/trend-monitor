domains:
  - id: harnesses
    name: 로봇 하네스·아키텍처
    weight_target: 0.40
    question: 프론티어 모델이 로봇을 장시간(long-horizon)·학습 없이(training-free) 제어하기 위한 하네스·도구·메모리·검증 구조가 어떻게 진화하고 있나
    definition: >
      프론티어 VLM/LLM을 최상위 제어기로 쓰는 로봇 하네스 논문·오픈소스·벤치마크.
      핵심 축: action interface(EEF/waypoint/SDK/code-cell), execution chaining, perception-as-tools(3D/depth/SAM/grasp),
      memory(에피소드/스킬/레슨/컨텍스트 정책), verification(transition check/audit/fail-stop),
      concurrency(비동기 실행·내레이터), safety boundaries, VLA/WAM-as-subpolicy, 비용·지연 최적화,
      로봇 하네스 벤치마크(RoboDojo, RoboMME, EBench, RoboProbe 등).
    drop:
      - 단순 산업용 PLC/하드웨어 기구학 논문(파운데이션 모델·에이전트와 무관)
      - 모델·하네스 기여 없는 단순 데모 홍보
      - 드론/자율주행 전용 제어(매니퓰레이션·범용 Embodied 하네스와 무관한 경우)

  - id: embodied_models
    name: 빅테크·연구 로보틱스 모델 실험
    weight_target: 0.25
    question: 빅테크와 탑티어 연구실이 로보틱스 파운데이션 모델(VLM/VLA/WAM/World Model)과 실세계 실험에서 무엇을 공개했나
    definition: >
      Google DeepMind(Gemini Robotics), NVIDIA(GR00T, Cosmos, SRL, Isaac), Physical Intelligence(pi0/pi0.5),
      OpenAI Robotics, Anthropic(computer-use/embodied 전이), Meta FAIR, Skild AI, Figure(Helix),
      UC Berkeley BAIR, Stanford, MIT, CMU, NAVER LABS 등의 로보틱스 모델 릴리스, 스케일링 실험, 월드 모델, 벤치마크, 공식 기술 블로그.
    drop:
      - 투자·밸류에이션·주가·인사 이동·단순 언론 인터뷰
      - 검증 수치 없는 단순 PR 영상

  - id: hardware_sdk
    name: 로봇 플랫폼·중국/글로벌 SDK·깃헙
    weight_target: 0.15
    question: Unitree, I2RT(YAM), AgiBot, Galaxea, LimX, Booster, LeRobot 등 로봇 플랫폼의 SDK·오픈소스·데이터셋·하드웨어 공지가 어떻게 바뀌었나
    definition: >
      중국 및 글로벌 로보틱스 기업·오픈소스 진영의 신규 리포지토리, SDK 업데이트, 텔레오퍼레이션,
      시뮬레이션 에셋(MuJoCo/IsaacLab/URDF), 오픈 데이터셋, LeRobot 통합, 신규 로봇(휴머노이드·양팔 매니퓰레이터) 공식 어나운스.
    drop:
      - 의미 없는 사소 패치 커밋이나 단순 오타 수정
      - 단순 전시회/마케팅 행사 보도

  - id: ai_frontier
    name: 프론티어 모델·에이전트 트렌드 (20%)
    weight_target: 0.20
    question: 로봇 하네스의 상한을 끌어올리는 프론티어 모델(비전·추론·지연·비용)과 코딩/도구 에이전트 하네스·프로토콜에 어떤 대형 변화가 있었나
    definition: >
      상용·오픈 프론티어 모델(Gemini, Claude, GPT, Qwen, DeepSeek)의 신규 세대·주요 버전·멀티모달/비전·가격·컨텍스트 변화,
      및 코딩 에이전트·에이전트 SDK·프로토콜(MCP, A2A, Claude Code, Codex, Gemini CLI, Google ADK, tool-use/computer-use API)의 메이저 릴리스.
    drop:
      - 소규모 패치, 파인튜닝 파생 모델, 개인 리뷰, 단순 튜토리얼, "N가지 도구" 목록 글
      - 투자·인수·소송·규제·일반 IT 뉴스

