  # ══════════════════════════════════════════════════════════════
  # 1. 학술 arXiv [H][M] — 로봇 하네스·Embodied AI 1차 논문 출처
  # ══════════════════════════════════════════════════════════════
  - id: arxiv_cs_ro
    name: arXiv cs.RO (Robotics)
    type: rss
    url: "https://rss.arxiv.org/rss/cs.RO"
    channel: academic
    primary: true
    status: active
    verified_at: "2026-11-25"
    selected: "[H][M] 로보틱스 전체 신착 논문 1차 출처 (cs.RO)"

  - id: arxiv_robot_harness
    name: arXiv Robot Harness & Frontier VLM Query
