  - {id: anthropic_rss, url: "https://www.anthropic.com/rss.xml", reason: "404, 공식 RSS 없음. sitemap 사용. 2026-11-25"}
  - {id: physical_intelligence, url: "https://www.physicalintelligence.company/sitemap.xml", reason: "429 Too Many Requests (pi.website 포함 봇 차단). 2026-11-25"}
