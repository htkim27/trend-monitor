    url: "https://export.arxiv.org/api/query?search_query=cat:cs.RO+AND+(abs:harness+OR+abs:%22long-horizon%22+OR+abs:%22vision-language-action%22+OR+abs:%22coding+agent%22+OR+abs:%22training-free%22)&sortBy=submittedDate&sortOrder=descending&max_results=30"
